- title: Experience
  type: time_table
  contents:
    - title: Machine Learning Research Engineer
      institution: MI-6 Co., Ltd., Tokyo, Japan
      year: Nov 2025 - present
      description:
        - Project owner for three concurrent R&D lines in optimization and AI for science.
        - "Budget-aware Bayesian optimization for autonomous experimentation: a closed-loop harness in which
          every proposed experiment is priced, charged against a budget, and refused if unaffordable, so policy
          quality is always reported beside spend. Twelve proposal policies, three acquisition optimizers, and
          a one-command reproducibility check that re-derives every committed figure from committed data."
        - "Search heuristics for computer-aided synthesis planning: a learned cost-to-go estimate reused to
          reorder candidate reactions by remaining distance to available starting materials, improving solve
          rate and reducing search effort at unchanged per-step compute. First-author conference abstract."
        - An installable, versioned software component publishing a data contract to a separate optimization
          engine, with determinism enforced as a test, module boundaries checked at process level, and
          continuous integration gating its own published result counts.
        - "Methodology across all three: pre-registered experiment designs, paired statistical tests with
          bootstrap confidence intervals, a stated detection floor beside every comparison, and negative
          results reported with their mechanism."
    - title: Machine Learning Research Intern
      institution: MI-6 Co., Ltd., Tokyo, Japan
      year: Aug 2025 - Nov 2025
      description:
        - Built a neural-guided bidirectional search method for double-ended synthesis planning, extending a
          published planner to handle convergent routes via a multi-tree forest and a proof-tree-complete
          meeting criterion.
        - Implemented Monte Carlo Tree Search with UCT and PUCT variants and graph-based heuristics for
          retrosynthetic pathway search; benchmarked against established baselines over public chemical databases.
        - Built multi-objective scoring for route selection across path length, cost and yield.
    - title: Machine Learning Research Associate
      institution: Indian Institute of Technology Mandi, India
      year: Jan 2025 - Mar 2025
      description:
        - Developed a Nystrom-based ADMM algorithm for federated learning, targeting the communication and
          memory cost of second-order information in distributed training.
        - Built a Python framework for decentralised training across multiple nodes, with convergence
          monitoring and benchmarking.
        - Co-PI; guided two M.Tech researchers. Delivered an invited talk on the method.
    - title: Research Assistant
      institution: Dept. of Intelligence Science & Technology, Kyoto University
      year: Dec 2021 - Mar 2023
      description:
        - Developed the regularized Nystrom method for large-scale optimization, reducing per-iteration cost
          from O(nd^2 + d^3) to O(ndm + dm^2) with sketch size m of roughly 5-20% of the feature dimension,
          and established global convergence under standard assumptions.
        - Benchmarked against randomized subspace Newton and Newton-sketch on high-dimensional classification.
        - Applied curvature-aware optimization to brain-MRI tumour classification with transfer learning.
    - title: E-Commerce & Marketing Research Analyst (part-time)
      institution: Hayakawa Co. Ltd., Kyoto, Japan
      year: May 2021 - Oct 2024
      description:
        - Held alongside doctoral research. Managed B2B client relationships and negotiations for international
          e-commerce, conducted competitive analysis for listings and pricing, and automated sales and
          inventory reporting.

