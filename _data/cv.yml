- title: Profile
  type: list
  contents:
    - I build optimization algorithms for large-scale machine learning and take them from a convergence
      proof to a benchmarked implementation. PhD in Informatics (Mathematical Optimization) from Kyoto University, with
      published work on second-order and variance-reduced methods that make curvature information affordable
      at high dimension. Currently project owner for three concurrent R&D lines at MI-6 Co., Ltd., spanning search
      heuristics for computer-aided synthesis planning, budget-aware Bayesian optimization for autonomous
      experimentation, and interface engineering between machine learning subsystems. Interested in research
      scientist and research engineer roles where mathematical optimization is the substance of the work.

