<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="440" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="879" height="439" fill="none" stroke="#dce2ea"/>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#49536a"/>
    </marker>
    <marker id="a2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c23a2b"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="15" font-weight="700" fill="#141821">A closed optimization loop where every experiment is paid for</text>
  <text x="24" y="54" font-size="12" fill="#49536a">The budget is a property of the system, not a number reported afterwards.</text>

  <!-- 1 surrogate -->
  <rect x="40" y="92" width="168" height="66" rx="4" fill="#e7f0f8" stroke="#1f6fb4" stroke-width="1.6"/>
  <text x="124" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f6fb4">1. Surrogate model</text>
  <text x="124" y="134" font-size="11" text-anchor="middle" fill="#49536a">Gaussian process fitted</text>
  <text x="124" y="148" font-size="11" text-anchor="middle" fill="#49536a">to everything measured</text>

  <!-- 2 acquisition -->
  <rect x="256" y="92" width="168" height="66" rx="4" fill="#e7f0f8" stroke="#1f6fb4" stroke-width="1.6"/>
  <text x="340" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1f6fb4">2. Acquisition</text>
  <text x="340" y="134" font-size="11" text-anchor="middle" fill="#49536a">maximise over the</text>
  <text x="340" y="148" font-size="11" text-anchor="middle" fill="#49536a">affordable set only</text>

  <!-- 3 cost model -->
  <rect x="472" y="92" width="168" height="66" rx="4" fill="#fbf2e2" stroke="#b06f12" stroke-width="1.6"/>
  <text x="556" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#b06f12">3. Cost model</text>
  <text x="556" y="134" font-size="11" text-anchor="middle" fill="#49536a">price c(x), fitted to</text>
  <text x="556" y="148" font-size="11" text-anchor="middle" fill="#49536a">real instrument runs</text>

  <!-- 4 ledger -->
  <rect x="688" y="92" width="152" height="66" rx="4" fill="#fbebe8" stroke="#c23a2b" stroke-width="1.6"/>
  <text x="764" y="116" font-size="12.5" font-weight="700" text-anchor="middle" fill="#c23a2b">4. Ledger</text>
  <text x="764" y="134" font-size="11" text-anchor="middle" fill="#49536a">can the remaining</text>
  <text x="764" y="148" font-size="11" text-anchor="middle" fill="#49536a">budget pay for it?</text>

  <!-- arrows across the top row -->
  <line x1="208" y1="125" x2="250" y2="125" stroke="#49536a" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="424" y1="125" x2="466" y2="125" stroke="#49536a" stroke-width="1.6" marker-end="url(#a2)"/>
  <line x1="640" y1="125" x2="682" y2="125" stroke="#49536a" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- refuse branch -->
  <path d="M764 158 L764 196 L340 196" stroke="#c23a2b" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a2r)"/>
  <text x="552" y="190" font-size="11.5" font-weight="700" text-anchor="middle" fill="#c23a2b">refused: propose again inside the budget</text>

  <!-- 5 experiment -->
  <rect x="472" y="244" width="168" height="66" rx="4" fill="#e6f2ed" stroke="#2e7d63" stroke-width="1.6"/>
  <text x="556" y="268" font-size="12.5" font-weight="700" text-anchor="middle" fill="#2e7d63">5. Run and charge</text>
  <text x="556" y="286" font-size="11" text-anchor="middle" fill="#49536a">instrument executes,</text>
  <text x="556" y="300" font-size="11" text-anchor="middle" fill="#49536a">cost debited</text>

  <!-- affordable path -->
  <path d="M800 158 L832 158 L832 277 L646 277" stroke="#2e7d63" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <text x="838" y="222" font-size="11" font-weight="700" fill="#2e7d63" transform="rotate(-90 838 222)">affordable</text>

  <!-- 6 observation back to surrogate -->
  <path d="M472 277 L124 277 L124 164" stroke="#1f6fb4" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <text x="298" y="270" font-size="11.5" text-anchor="middle" fill="#1f6fb4">6. new observation returns to the model</text>

  <!-- box: what gets measured -->
  <rect x="40" y="336" width="800" height="84" rx="4" fill="#f4f6f8" stroke="#dce2ea"/>
  <text x="56" y="358" font-size="12" font-weight="700" fill="#141821">What this changes about evaluation</text>
  <text x="56" y="378" font-size="11.5" fill="#49536a">Iteration-counting asks only "how good was the best value found?". Two further questions become answerable:</text>
  <text x="56" y="396" font-size="11.5" fill="#49536a">regret per unit spent, rather than per iteration; and completion rate, the fraction of campaigns that finish</text>
  <text x="56" y="412" font-size="11.5" fill="#49536a">inside the budget at all. A policy can win on the first axis and be undeployable on the second.</text>
</svg>
